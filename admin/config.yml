backend:
  name: github
  repo: nopcanoekayak/nop-website
  branch: main

# ==========================================================
# ΑΣΦΑΛΗ FILENAMES
# ==========================================================
# Τα filenames των νέων άρθρων δημιουργούνται μόνο
# από ημερομηνία + ώρα + λεπτό + δευτερόλεπτο.
#
# Παράδειγμα:
# 2026-08-15-163045.md
#
# Έτσι δεν χρησιμοποιείται ποτέ ο ελληνικός τίτλος
# στο filename.
# ==========================================================

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ==========================================================
# MEDIA
# ==========================================================

media_folder: "content/news/uploads"
public_folder: "/content/news/uploads"

# ==========================================================
# NEWS
# ==========================================================

collections:

  - name: "news"

    label: "Νέα / Ανακοινώσεις"

    label_singular: "Νέα"

    folder: "content/news"

    create: true

    # ======================================================
    # FILENAME
    # ======================================================
    #
    # Παράδειγμα:
    # 2026-08-15-163045.md
    #
    # Δεν χρησιμοποιούμε {{slug}}, άρα ο ελληνικός τίτλος
    # δεν επηρεάζει καθόλου το όνομα του αρχείου.
    # ======================================================

    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"

    fields:

      # ----------------------------------------------------
      # ΤΙΤΛΟΣ
      # ----------------------------------------------------

      - label: "Τίτλος"
        name: "title"
        widget: "string"


      # ----------------------------------------------------
      # ΗΜΕΡΟΜΗΝΙΑ
      # ----------------------------------------------------

      - label: "Ημερομηνία"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm"


      # ----------------------------------------------------
      # ΚΑΤΗΓΟΡΙΑ
      # ----------------------------------------------------

      - label: "Κατηγορία"
        name: "category"
        widget: "select"
        options:
          - "Νέα"
          - "Ανακοίνωση"
          - "Αγωνιστικά"
          - "Διακρίσεις"


      # ----------------------------------------------------
      # ΚΕΝΤΡΙΚΗ ΦΩΤΟΓΡΑΦΙΑ
      # ----------------------------------------------------

      - label: "Κεντρική φωτογραφία"
        name: "image"
        widget: "image"
        required: false


      # ----------------------------------------------------
      # ΣΥΝΤΟΜΗ ΠΕΡΙΓΡΑΦΗ
      # ----------------------------------------------------

      - label: "Σύντομη περιγραφή"
        name: "excerpt"
        widget: "text"
        required: false


      # ----------------------------------------------------
      # ΚΥΡΙΟ ΚΕΙΜΕΝΟ
      # ----------------------------------------------------

      - label: "Κείμενο"
        name: "body"
        widget: "markdown"
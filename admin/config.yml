backend:
  name: github
  repo: nopcanoekayak/nop-website
  branch: main

# ==========================================================
# ΑΣΦΑΛΗ FILENAMES / SLUGS
# ==========================================================
# Τα ονόματα των αρχείων θα δημιουργούνται μόνο με
# λατινικούς χαρακτήρες, αριθμούς και παύλες.
# Οι ελληνικοί τίτλοι θα παραμένουν κανονικά ελληνικοί
# μέσα στο άρθρο και στο site.
# ==========================================================

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ==========================================================
# MEDIA
# ==========================================================

media_folder: "content/news/uploads"
public_folder: "/content/news/uploads"

# ==========================================================
# NEWS COLLECTION
# ==========================================================

collections:

  - name: "news"

    label: "Νέα / Ανακοινώσεις"

    label_singular: "Νέα"

    folder: "content/news"

    create: true

    # Παράδειγμα:
    # 2026-08-15-istorikos-thriamvos.md
    #
    # Το {{slug}} πλέον θα γίνεται ASCII-safe.
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      # ----------------------------------------------------
      # ΤΙΤΛΟΣ
      # ----------------------------------------------------

      - label: "Τίτλος"

        name: "title"

        widget: "string"


      # ----------------------------------------------------
      # ΗΜΕΡΟΜΗΝΙΑ
      # ----------------------------------------------------

      - label: "Ημερομηνία"

        name: "date"

        widget: "datetime"

        format: "YYYY-MM-DD HH:mm"


      # ----------------------------------------------------
      # ΚΑΤΗΓΟΡΙΑ
      # ----------------------------------------------------

      - label: "Κατηγορία"

        name: "category"

        widget: "select"

        options:

          - "Νέα"

          - "Ανακοίνωση"

          - "Αγωνιστικά"

          - "Διακρίσεις"


      # ----------------------------------------------------
      # ΚΕΝΤΡΙΚΗ ΦΩΤΟΓΡΑΦΙΑ
      # ----------------------------------------------------

      - label: "Κεντρική φωτογραφία"

        name: "image"

        widget: "image"

        required: false


      # ----------------------------------------------------
      # ΣΥΝΤΟΜΗ ΠΕΡΙΓΡΑΦΗ
      # ----------------------------------------------------

      - label: "Σύντομη περιγραφή"

        name: "excerpt"

        widget: "text"

        required: false


      # ----------------------------------------------------
      # ΚΥΡΙΟ ΚΕΙΜΕΝΟ
      # ----------------------------------------------------

      - label: "Κείμενο"

        name: "body"

        widget: "markdown"